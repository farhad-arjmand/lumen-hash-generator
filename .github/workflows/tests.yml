name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
          - php: '8.3'
            laravel: '12'
          - php: '8.3'
            laravel: '13'
          - php: '8.4'
            laravel: '13'
          - php: '8.5'
            laravel: '13'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with 'laravel/framework:^${{ matrix.laravel }}.0' --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer audit
      - run: php examples/basic.php
      - run: bash tools/smoke-install.sh
